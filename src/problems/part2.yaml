  solved: "A proof or a refutation of the equivalence, with the renormalisation identified if one is needed."
  litcheck: "Miraculous duality and duality for automorphic sheaves over curves were found [@Gaitsgory2018; @Arinkin2020]; no arithmetic analogue was found."

- num: 56
  title: "Construct the global arithmetic curve"
  work: S07
  kind: math
  level: programme
  thesis: 8
  source: "Problem 40.10, p. 1602"
  pages: ["1602"]
  status: "CONJECTURE"
  statement: |
    Exhibit a condensed analytic stack over the sphere spectrum satisfying the eight clauses of the definition of the
    global arithmetic curve $\mathfrak X_{\mathbb Z}$ [@S07, Definition 10.15] — finite syntomic charts, an archimedean
    chart, a restricted adelic halo with a rational diagonal, the gluing as a homotopy fibre product, an absolute
    Frobenius, a gauge map to $\mathbb A^1/\mathbb G_m$, a place map to $\operatorname{Spec}\mathbb Z$, and a
    fundamental class in degree three — prove it unique up to canonical equivalence, and equip it with a six-functor
    formalism with proper base change and Verdier duality.
  established: "“What exists at present is a specification and two of its charts.” The finite charts are theorems of Bhatt–Lurie and Drinfeld; the archimedean chart is stipulated. “The obstacle is not the charts. It is the gluing, and the reason is specific. Adelic descent along a restricted product is not a standard operation in any existing formalism.”"
  proposer: "[@S07]."
  background: "[@BhattLurie2022]; [@Drinfeld2020]; [@BeauvilleLaszlo1995]; [@FarguesScholze2021]; [@Scholze2019condensed]."
  solved: "A construction with the eight clauses, the uniqueness statement and the six-functor formalism, or a proof that no object satisfies the eight clauses."
  litcheck: "No construction of this kind was found."

- num: 57
