# The 57 Grothendieckian Problems — Part II, Series 03–07 (Problems 36–57). Conventions as in part1-s01.yaml.
# None of these problems is, or is equivalent to, the named conjecture that its source work studies; where a problem
# bears on such a conjecture, the card says how, and says that the source does not prove it.
- num: 36
  title: "Polarization of a cyclotomic spectrum"
  work: S03
  kind: math
  level: research
  thesis: 8
  source: "Problem 24.18, p. 539 (restated as Problems 29.8 and 30.16); Criterion 57.5, p. 1145"
  pages: ["539", "1145"]
  status: "O (open)"
  statement: |
    Define a polarization of a cyclotomic spectrum: extra data on Real topological Hochschild homology (THR)
    $(\mathrm{THR}(R),O(2),\{\varphi^{\mathbb R}_p\})$, generalising an ample class or a Kähler form, such that (i) it
    induces a real quadratic form on $\pi_*(\mathrm{THR}(R)^{hO(2)})$ through a trace state; (ii) “the form is definite
    on primitive parts with respect to a Lefschetz decomposition”; and (iii) for $X$ smooth projective over
    $\mathbb F_q$ with an ample line bundle, “it recovers the Hodge index theorem on crystalline cohomology / the
    positivity underlying the Weil conjectures.”
  established: |
    The source explains why (iii) is already delicate: crystalline cohomology carries no real structure, and the
    Katz–Messing comparison transports eigenvalues but not the positivity mechanism. Criterion 57.5 fixes a test: a
    proposed polarization solves the problem only if, applied to the topological Hochschild homology $\mathrm{THH}(C)$ of a curve $C$ over $\mathbb F_q$ of
    genus $g\ge1$, it proves $|\alpha_i|=\sqrt q$ for the inverse roots of the numerator of $Z(C,t)$ without invoking
    Weil’s theorem, Riemann–Roch on $C\times C$ or the Hodge index theorem.
  proposer: "[@S03]."
  background: "[@NikolausScholze2018]; [@DMPR2021]; [@Deligne1974]."
  solved: |
    A definition satisfying (i)–(iii), with the test of Criterion 57.5 passed for every curve over a finite field. The bound $|\alpha_i|=\sqrt q$ is a theorem (Weil); the problem is to obtain it from the new structure.
  litcheck: "Work on Real topological Hochschild homology and its cyclotomic structure was found [@DMPR2021]; no notion of polarization of the required kind was found."

- num: 37
  title: "Construction Problem A1 on the syntomic stack"
  work: S03
  kind: math
  level: research
  thesis: 8
  source: "Problem 22.9, p. 483"
  pages: ["483"]
  status: "O"
  statement: |
    Construct, on quasi-coherent sheaves on the syntomic stack $\mathbb Z_p^{\mathrm{syn}}$ (equivalently on
    $F$-gauges over $\mathbb Z_p$), a $\mathbb C$-linear endomorphism $\Theta$ of the underlying object after
    $\otimes_{W,\iota}\mathbb C$ such that (A1.1) on the Hodge–Tate locus $\Theta=-\tfrac{2\pi i}{\log q}\Theta_{\mathrm{Sen}}$
    for objects pulled back from $\mathbb F_q$; (A1.2) $q^\Theta=\mathrm{Fr}_q^*$ for $F$-gauges coming from smooth
    proper $X/\mathbb F_q$; (A1.3) $\Theta$ is $\mathbb C$-linear, which “rules out semilinear operators”; and (A1.4) the
    regularized determinant $\det_\infty(s-\Theta)$ on motivic cohomology converges and equals $\zeta(X,s)$.
  established: |
    The source isolates the difficulty in (A1.3): the Frobenius part of $\Theta$ is semilinear over $W$, and over $\mathbb Z_p$ no power of $\varphi$ is $W$-linear. “The syntomic stack exists, but the operator on it does not—yet.”
  proposer: "[@S03]."
  background: "[@BhattScholze2022]; [@BhattLurie2022]; [@Drinfeld2020]."
  solved: "A construction satisfying (A1.1)–(A1.4), or a proof that no endomorphism with (A1.1)–(A1.3) exists."
  litcheck: "The Sen operator on the Hodge–Tate stack is known [@BhattLurie2022; @Drinfeld2020]; no operator with (A1.1)–(A1.4) was found."

- num: 38
  title: "Archimedean Frobenius from quaternionic THH"
  work: S03
  kind: math
  level: research
  thesis: 8
  source: "Problem 28.13, p. 604; Construction 28.14, p. 605"
  pages: ["604", "605"]
  status: "O (first half answered since; see the literature check)"
  statement: |
    Problem 28.13 of [@S03] asks two questions. The first — whether there is “a lift of THH to genuine Pin(2)-spectra
    rather than O(2)-spectra” — has been answered: quaternionic topological Hochschild homology THQ, defined for rings
    with twisted $C_4$-action, carries a $\mathrm{Pin}(2)$-action [@AMP2026]. The second remains: is its
    $\mathrm{Pin}(2)$-homotopy fixed-point theory “the correct 𝜑∞ for symplectically self-dual motives, with 𝑂(2)
    handling the orthogonal ones?” Concretely, determine whether $\mathrm{THQ}(R)^{h\mathrm{Pin}(2)}$ carries an operator
    $\Theta_\infty$ satisfying the analogue of requirement (C′1) of Construction 28.14 — its half-line spectrum, with
    Hodge multiplicities, gives the archimedean local factors of symplectically self-dual motives by
    $\det_\infty((s-\Theta_\infty)/2\pi)$.
  established: |
    The source calls the question “a well-posed question in equivariant stable homotopy theory, independent of RH”,
    and states that “No existing construction is known”; that statement is corrected here (it is recorded in the
    errata of the repository). Construction 28.14 lists the requirements (C′1)–(C′4) for the orthogonal case.
  proposer: "[@S03]."
  background: "[@AMP2026]; [@DMPR2021]; [@Manolescu2016]; [@NikolausScholze2018]."
  solved: |
    An operator on $\mathrm{THQ}(R)^{h\mathrm{Pin}(2)}$ for a stated class of rings with the required structure, with a proof of the analogue of (C′1) for symplectically self-dual motives in that class; or a proof that no natural operator can satisfy it.
  litcheck: "Found: Angelini-Knoll, Merling and Péroux construct THQ with its Pin(2)-action (arXiv:2409.18187, 2024; Adv. Math. 2026) [@AMP2026]. This answers the first question of Problem 28.13; no work on the second was found."

- num: 39
  title: "A certified inertia for the pole-removed Weil form"
  work: S03
  kind: machine
  level: entry
  thesis: 9
  source: "Criterion 58.9 (falsification predicate F2), p. 1169; Proposition 46.5 and Remark 46.13, pp. xxxv, 919"
  pages: ["1169", "xxxv", "919"]
  status: "E (finite measurement) / O"
  statement: |
    For sixty-three cubic-spline test spaces $V_{T,N}$ ($0.15\le T\le 3$, $4\le N\le 64$) the source measured, in
    floating point with tolerance $10^{-9}$, that the pole-removed Weil form $B_N=W_N-P_N$ has inertia $(N-1,1)$.
    Certify this measurement in interval or exact arithmetic for each configuration — certify $N-1$ positive
    eigenvalues and exhibit a vector $z$ with a certified enclosure of $B_N(z,z)<0$ — or show for some configuration
    that the certified inertia differs, which is falsification predicate F2 of [@S03, Criterion 58.9].
  established: |
    Under RH the full Weil form is positive semidefinite and $n_-(B_N)\le1$ (Corollary 46.11); the lower bound
    $n_-(B_N)\ge1$ is not proved conditionally or otherwise (Warning 46.12). The measurement is finite evidence: “What
    the data exclude is a large second negative direction. What they do not exclude is a small one.” F2 asks for “the
    computation certified in interval arithmetic”.
  proposer: "[@S03]."
  background: "Weil positivity at the archimedean place [@ConnesConsani2021]; interval arithmetic [@Johansson2017]; certified computation of zeta zeros [@PlattTrudgian2021]; certification for other finite truncations of the Weil form [@Groskin2026]."
  solved: "Certified inertia for all sixty-three configurations of Proposition 46.5, with the code and the enclosures published; a configuration whose certified inertia is not $(N-1,1)$ also solves the problem, by firing F2. The result is a statement about finitely many matrices; it is not evidence for or against RH."
  litcheck: "A certification rule and an interval factorization for the Galerkin truncations of the Weil quadratic form of Connes, van Suijlekom, Consani and Moscovici were found [@Groskin2026]; no certified computation of the inertia of the Gram matrices of these sixty-three test spaces was found."

- num: 40
  title: "The Tamagawa factor as a local term"
  work: S04
  kind: math
  level: research
  thesis: 9
  source: "Problem 22.7.1, p. 173; §2.8.1, p. 19; §56.3, p. 437"
  pages: ["173", "19", "437"]
  status: "OPEN"
  statement: |
    The source proposes three constructions of the bad-prime term $c_p$ of the conjecture of Birch and
    Swinnerton-Dyer: a vertical intersection multiplicity on the arithmetic surface, a Lefschetz–Verdier term of a
    fixed-point stack, and a determinant defect of the prismatic/Néron component lattice. Problem 22.7.1: “Construct the
    three local objects just described and prove that each has Euler characteristic c_p, compatibly with change of
    model, Frobenius action, and the integral orientation of the fundamental line.”
  established: |
    The identification of $c_p$ as a Lefschetz–Verdier local term is listed among the book’s novelties, and the
    source fixes the test: “This is a particularly useful falsification test. Tate’s algorithm gives c_p independently
    for every database curve. If a proposed prismatic or fixed-point formula disagrees even once, that local
    construction is wrong. No appeal to BSD can repair such a disagreement.” The book lists this among the items that
    are “testable now, independently of BSD.”
  proposer: "[@S04]."
  background: "[@Tate1975]; [@BlochKato1990]; [@BhattScholze2022]."
  solved: "The three constructions with proofs that each has Euler characteristic $c_p$ with the stated compatibilities; or a curve and a prime at which a proposed construction disagrees with Tate’s algorithm, which refutes that construction. The problem concerns local terms and does not bear on the truth of BSD."
  litcheck: "No prismatic or fixed-point formula for the Tamagawa factor was found."

- num: 41
  title: "The arithmetic flow"
  work: S04
  kind: math
  level: programme
  thesis: 8
  source: "Problem 53.2.4 (Obstruction IV), p. 416; Problem 4.5.1, p. 37"
  pages: ["416", "37"]
  status: "OPEN"
  statement: |
    Construct a strongly continuous flow on a cohomology theory over $\operatorname{Spec}\mathbb Z$ whose primitive
    closed orbits are the primes, the orbit at $p$ having length $\log p$, with no spurious orbits and with a generator
    satisfying the weight adjunction. In the form of Problem 4.5.1: a foliated or laminated space with a flow and a
    leafwise cohomology admitting duality and regularized determinants, whose Lefschetz trace formula is the explicit
    formula.
  established: |
    “The flow Φ𝑡 is postulated, not built. No ℝ≥0-action has ever been constructed on any cohomology theory over Specℤ whose primitive closed orbits are the primes with lengths log p”. For Problem 4.5.1: “No object satisfying these requirements is presently known.” The cyclotomic structure of THH supplies $\psi_p$ at each prime; the interpolation to a continuous action is missing.
  proposer: "Deninger [@Deninger1998]; restated, with the source’s axioms, in [@S04]."
  background: "[@Deninger1998]; [@NikolausScholze2018]."
  solved: |
    A construction with the stated properties, or a no-go theorem showing that no $\mathbb R_{\ge0}$-action of the required kind exists on any cohomology of $\operatorname{Spec}\mathbb Z$ (item (ii) of the refutation list of [@S04, §2.8.1]).
  litcheck: "Trace formulas for foliated flows and regularized-determinant formulas in Deninger’s framework were found; no construction over Spec ℤ was found."

- num: 42
