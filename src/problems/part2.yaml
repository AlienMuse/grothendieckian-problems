  pages: ["1603"]
  status: "CONJECTURE"
  statement: |
    Let $q\colon\mathrm{Bun}_G(\mathfrak X_{\mathbb Z})\to\mathrm{pt}$ be the structure map. Prove or refute that
    $q_!\simeq q_*$ on $\mathrm{Shv}_{\mathcal N}(\mathrm{Bun}_G(\mathfrak X_{\mathbb Z}))$ after Whittaker
    renormalisation; if the equivalence holds only after a renormalisation, identify it explicitly and determine whether
    it is canonical.
  established: |
    “This is the load-bearing hypothesis of the entire framework.” Over a curve the corresponding statement, miraculous duality, is a theorem of Drinfeld and Gaitsgory; over $\mathfrak X_{\mathbb Z}$ the local finiteness its proof uses is unavailable. “It is also the gap about which the least can currently be said.”
  proposer: "[@S07]; over a curve the source cites miraculous duality as a theorem of Drinfeld and Gaitsgory; see [@Gaitsgory2018] and [@Arinkin2020]."
