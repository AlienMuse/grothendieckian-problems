- num: 43
  title: "Murmurations from the flow: a falsification test"
  work: S04
  kind: machine
  level: entry
  thesis: 9
  source: "Conjecture 36.4.6, pp. 276–277"
  pages: ["276", "277"]
  status: "OPEN (a falsifiable prediction)"
  statement: |
    If the framework of [@S04] is correct, the murmuration density arises as a transition term in its Lefschetz–Verdier
    localisation, and three computable predictions follow: (i) $y=p/N$ is the natural coordinate, and no other
    combination of $p$ and $N$ appears in the leading term; (ii) the density for elliptic curves, if it exists, has the
    same oscillation frequencies as the modular-form density $M_2$; (iii) the rank-conditioned densities are governed
    by the same density with the root number replaced by the Selmer fixed-point class. Carry out the tests.
  established: "“Each clause is falsifiable by computation. Clause (i) fails if any family shows a leading term depending on p and N other than through p/N; clause (ii) fails if the observed elliptic-curve frequencies differ from those of M2.” The protocol is in Chapter 55."
  proposer: "[@S04]."
  background: "[@HLOP2022]; [@Zubrilina2023]; [@SawinSutherland2025]; [@Cowan2024]."
  solved: "The tests of clauses (i) and (ii) carried out under the protocol of [@S04, Ch. 55] against the densities of [@Zubrilina2023] and [@SawinSutherland2025], with data and code published and the outcome reported in either direction; clause (iii) when the Selmer class is computable."
  litcheck: "A conjectural explicit murmuration density for elliptic curves ordered by height has been given [@SawinSutherland2025], and murmurations have been derived from ratios conjectures [@Cowan2024]; these supply what clause (ii) is tested against. No test of the three clauses was found."

