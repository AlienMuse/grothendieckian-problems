# The 57 Grothendieckian Problems — Part I, Series 01 (Problems 1–17). Single source for the paper, the repository
# cards and problems.json. Quotation marks “…” enclose text quoted verbatim from the work and pages named in `pages`
# (quote_gate). [@key, locator] cites src/refs.yaml. Literature checks: out/litcheck/NN.json (2026-10-28).
- num: 1
  title: "The first rising-sea event"
  work: S01
  kind: machine
  level: programme
  thesis: 8
  source: "Vol. III, §5.1, p. 8034, and §5.8, p. 8039"
  pages: ["8034", "8039"]
  status: "S/R (source-grounded synthesis; falsifiable research construction)"
  statement: |
    Carry out one operational rising-sea event in the sense of [@S01, Vol. III, §5.1]. Such an event “must begin from
    an explicit obstruction or language deficit, propose a typed extension, compile bounded probes, preserve or
    explicitly surrender recovery, record costs and residuals, and submit any status request to authority outside the
    producing engines.” The problem asks for an event of this kind after which the original difficulty, stated before
    the event, has become tractable in the extended setting without the question having been changed.
  established: |
    The source fixes the sequence obstruction → typed extension → bounded execution and checking → computed, partial or
    failed → recovery and transport → external request, observes that “Each arrow may fail”, and declines to promote
    the strategy: “Volume III does not turn that strategy into a universal theorem of problem solving. It turns it into
    a falsifiable campaign record.” It names four ways in which an extension changes the question instead of answering
    it: an extension that “deletes the predicate expressing a contradiction, forgets the invariant detecting failure,
    weakens equality until disagreement disappears, or renames an unknown as a new primitive has not resolved the
    original obstruction.” Section 5.8 specifies the residual and non-equivalence records that a partial outcome must
    leave. No event has been carried out.
  proposer: "The image of the rising sea is Grothendieck’s [@McLarty2007]; its operational form and this problem are from [@S01]."
  background: "[@McLarty2007]; [@Lakatos1976]; machine-guided discovery with an external evaluator [@Davies2021; @RomeraParedes2024]."
  solved: |
    A campaign record is published that a third party can replay, in which (i) every step of the §5.1 sequence is
    present as a typed artifact; (ii) the target statement, frozen before the campaign, receives in the extended setting
    a kernel-checked proof, a kernel-checked refutation, or a reduction to named hypotheses with their statuses
    recorded; and (iii) a reviewer independent of the producing system certifies that none of the four failures of
    §5.1 applies. A complete record of a failed campaign is listed as a partial result.
  litcheck: "No published campaign record of this form was found. Machine-guided discovery systems [@Davies2021; @RomeraParedes2024; @Trinh2024] evaluate candidates externally but do not record the four failure patterns or a separate status request."

- num: 2
  title: "A bounded fixed point of the coupled world–language cycle"
  work: S01
  kind: formal
  level: programme
  thesis: 10
  source: "Vol. III, §75.17, pp. 9503–9504; §75.11, pp. 9499–9500; §56.15, pp. 9130–9131"
  pages: ["9503", "9504", "9499", "9500", "9130", "9131"]
  status: "O (obligation)"
  statement: |
    Give a formal transition model of the coupled world–language cycle of [@S01, Vol. III, Ch. 71–78] and prove, in a
    proof assistant, three properties of it: (a) the obligation-preservation inclusion
    $O^{\mathrm{open}}_n \subseteq O^{\mathrm{open}}_{n+1} \cup O^{\mathrm{dis}}_{n+1} \cup O^{\mathrm{term}}_{n+1}$
    of §75.11 holds for every accepted step; (b) the six conditions of §75.17 under which “A cycle reaches
    BOUNDED_FIXED_POINT” are decidable from the records; and (c) every run terminates, since “A conforming campaign
    therefore carries a well-founded repair measure or a hard policy bound.”
  established: |
    The conditions are stated as contracts; none is proved. Failure of the inclusion in (a) “is sufficient for refusal
    or quarantine, regardless of the attractiveness of the new result.” The source limits what a fixed point means:
    “This is not equality of world and language, global convergence, consistency, optimality, or future stability.”
  proposer: "[@S01]."
  background: "Transition systems and invariants in the style of [@HerlihyWing1990]; mechanised metatheory [@BarendregtWiedijk2005]."
  solved: |
    A machine-checked development (Lean, Rocq, Isabelle or Agda) that defines the model, documents its correspondence
    with §§75.11 and 75.17 clause by clause, and proves (a)–(c); or a machine-checked counterexample showing that one
    of them fails in every model faithful to the source.
  litcheck: "No formal model of this cycle was found; the searches returned general work on invariants in refinement-based verification only."

- num: 3
  title: "From obstruction to conjecture"
  work: S01
  kind: machine
  level: research
  thesis: 10
  source: "Vol. IV, §109.1, p. 11670, and §109.5, p. 11675 (algorithm ALG-118)"
  pages: ["11670", "11675"]
  status: "ALG-R (research algorithm)"
  statement: |
    Implement the obstruction-driven conjecture generator ALG-118 of [@S01, Vol. IV, Ch. 109], which takes replayable,
    typed records of failed constructions or proof attempts and returns scoped conjectures, each with at least one executable falsifier, and run it until it produces a conjecture that is then settled by others.
  established: |
    The source specifies the contract and its limits: “An obstruction can explain why a particular construction,
    proof route, or finite experiment failed. It does not by itself establish the negation, necessity, naturalness, or
    novelty of a conjecture inferred from that failure.” Status is not affected by how a candidate looks: “Frequency,
    linguistic plausibility, retrieval rank, model agreement, elegance, and apparent usefulness do not change its
    epistemic status.” Falsifiers are part of the output, and “No finite search can certify an unrestricted
    conjecture.” No implementation exists.
  proposer: "[@S01]."
  background: "[@Lakatos1976]; automated conjecturing [@Fajtlowicz1988; @Raayoni2021]; [@Davies2021]."
  solved: |
    An implementation run on a published set of typed obstructions, with the full record of every candidate and of its
    falsifiers, such that at least one generated conjecture that is not in the frozen corpus (in the scoped sense of
    [@S01, Vol. IV, §110.8]) is afterwards proved, or refuted by a replayed counterexample, by parties independent of
    the generator.
  litcheck: "Theory exploration and conjecturing systems were found [@Fajtlowicz1988; @Raayoni2021]; none takes typed obstruction records as input or attaches falsifiers to each output."

- num: 4
  title: "Minimal extension questions"
  work: S01
  kind: machine
  level: research
  thesis: 1
  source: "Vol. III, §24.10, pp. 8440–8441"
  pages: ["8440", "8441"]
  status: "O (obligation)"
  statement: |
    “MinimalExtensionQuestion turns a diagnosed deficit into an ordered search over semantic deltas.” For a declared
    class of mathematical worlds and a declared partial order on deltas, give a procedure that, from an independently
    checked obstruction, returns an extension that is minimal for that order, consistent, conservative over the
    predecessor world, and reopens the blocked obligation; or prove that no such procedure exists for the class.
  established: |
    The question belongs to the Topos New-Creation Architecture (TNCA), the engine of [@S01] that proposes successor
    worlds. The source fixes the meaning of minimality — “Minimality is relative to that declared partial order, not to
    implementation effort or textual brevity” — and gives the two failure modes it must avoid (jumping to a stronger
    logic, and refusing an extension that is needed). It states what is missing: “TNCA has not shown existence,
    consistency, conservativity, or usefulness of any answer.”
  proposer: "[@S01]."
  background: "Conservative extensions in logic and type theory; [@MacLane1998] for the categorical constructions involved."
  solved: |
    A stated class of worlds (for example finitely axiomatised first-order theories or finite presentations of
    categories), a declared order on deltas, and a machine-checked proof that the procedure is correct on the class,
    with an implementation evaluated on published obstructions; or a machine-checked impossibility result for a class
    of comparable generality.
  litcheck: "Work on conservative extension and minimal extensions in logic was found; no procedure with the inputs and guarantees of §24.10 was found."

- num: 5
  title: "Target fidelity"
  work: S01
  kind: machine
  level: research
  thesis: 6
  source: "Vol. III, §30.10, p. 8574, and §64.17, p. 9294; Architectural Prospectus, p. 7966; Vol. IV, §5.16, p. 9846"
  pages: ["8574", "9294", "7966", "9846"]
  status: "O (obligation)"
  statement: |
    A proof kernel checks a proof against a formal statement; it does not check that the formal statement is the
    mathematics it was meant to express. In the source: “A named, pinned formal kernel may check a proof term against a
    formal target; target fidelity and publication authority remain separate obligations.” Give a certificate format
    and checker for the fidelity of a formal statement to a statement in a source text, within a declared fragment of
    mathematical language and a declared library.
  established: |
    The source treats every machine proof as a candidate “until source-target fidelity, kernel replay, and
    axiom-closure review pass under the same canonical subject key”, and lists among the open obligations of the
    formal layer to “verify that adapted definitions and rule candidates faithfully reflect the cited locators and
    declared deltas” and “target-fidelity theorems connecting source constructs to generated declarations”.
  proposer: "[@S01]; the question is shared with the autoformalization literature [@Wu2022; @FormalConjectures2026]."
  background: "[@BarendregtWiedijk2005]; [@Wu2022]; misformalization records in [@FormalConjectures2026]."
  solved: |
    A certificate format that binds a formal target, a source locator and a declared map of definitions, and a checker
    that rejects every certificate in a published adversarial suite of statement pairs with deliberately introduced
    misformalizations (quantifier order, hypothesis loss, changed definitions) while accepting the faithful pairs,
    with the suite, the checker and the results released for independent replay.
  litcheck: "Many 2025–2026 preprints measure faithfulness of autoformalization by scores or round-trip tests; none found issues a fidelity certificate of the kind required here."

- num: 6
  title: "Verified encodings of universal properties"
  work: S01
  kind: formal
  level: research
  thesis: 3
  source: "Vol. III, §18.5, p. 8307, and §21.16, item 8, p. 8370"
  pages: ["8307", "8370"]
  status: "O (obligation)"
  statement: |
    The component MUF-H (Motivic Universal Factorization Algorithm—Hybrid) of [@S01] solves universal-property constraints for finite proxies of categories. “A solver
    that returns a satisfying assignment only proves satisfiability of the encoded finite constraints if the encoding
    and certificate are independently checked. It does not establish that the encoding captures the intended universal
    property.” For finite categories given by their composition tables, give an encoding of the statement that a cone (or cocone) is a limit (colimit) of a finite diagram into constraints a solver can decide, and prove the encoding correct.
  established: |
    The source requires that “Universality encodings still require an independently checked correspondence between
    mathematical quantifiers and constraints”, and that existence of mediating maps and their uniqueness be recorded as
    separate obligations, since “Universality requires a quantified mediating property and generally uniqueness at an
    explicitly stated identity strength.”
  proposer: "[@S01]."
  background: "[@MacLane1998]; [@MacLaneMoerdijk1992]."
  solved: |
    A machine-checked theorem that, for every finite diagram in a finite category,
    the solutions of the encoded constraints correspond bijectively to mediating morphisms and that the uniqueness
    check is complete, together with a verified checker for solver certificates.
  litcheck: "General work on constraint solving and finite model finding was found; no verified encoding of universal properties was found."

- num: 7
  title: "The AURORA-K0 kernel, I: syntax and checking"
  work: S01
  kind: formal
  level: research
  thesis: 2
  source: "Vol. III, §70.19, pp. 9428–9429 (obligations K0-META-001 to K0-META-009)"
  pages: ["9428", "9429"]
  status: "O (“Every item begins OPEN”)"
  statement: |
    Mechanise AURORA-K0, the small formal kernel of the experimental calculus AURORA [@S01, Vol. III, Ch. 70], and discharge the first nine obligations of its registry, among them that the
    “Concrete grammar has unique parsing after canonical Unicode normalization”, that “Substitution preserves K0
    typing”, that “Registered reduction preserves typing”, that “Algorithmic checking agrees with declarative K0
    rules”, and that the “Definitional equality procedure is decidable for the declared finite fragment”.
  established: |
    The registry lists each obligation with the evidence required before its status may change, and rules out the
    shortcut: “No row may become RECEIPT_BOUND merely because a checker returns success.” No obligation is discharged.
  proposer: "[@S01]."
  background: "The de Bruijn criterion and small kernels [@BarendregtWiedijk2005]; [@deMouraUllrich2021]; [@Carneiro2024]."
  solved: |
    A development in a proof assistant that defines K0 as in the exact edition of Chapter 70 and proves
    K0-META-001 to K0-META-009 using no axioms beyond the assistant’s standard ones; a machine-checked counterexample to
    any item also counts and is recorded as a correction to the source.
  litcheck: "Mechanised metatheory of type theories is an established field; no mechanisation of K0 was found."

