  litcheck: "Reproducible-builds practice [@LambZacchiroli2022] addresses the same property for software artifacts; no implementation of this profile was found."

- num: 13
  title: "A frozen benchmark for counterexample and proof discovery"
  work: S01
  kind: machine
  level: entry
  thesis: 12
  source: "Vol. IV, §113.1, p. 11744; §113.12.12 to §113.12.15, pp. 11763–11764"
  pages: ["11744", "11763", "11764"]
  status: "D (specified, not run)"
  statement: |
    Release the first version of the benchmark specified in [@S01, Vol. IV, Ch. 113]. “A benchmark is not merely a
    directory of examples and a script that prints a score.” Before any run, it “must freeze the task, version,
    population, split, metric, abstention policy, leakage boundary, resource model, and reporting semantics”, and it
    must separate counterexample tasks into strata A–F and proof tasks into the seven types of §113.12.13.
  established: |
    The specification is complete and unexecuted. Its scoring rules include that “Stratum E evaluates whether the
    system reports bounded unknown honestly; it does not reward a claim that the theorem is true”, and that “Hidden
    proofs are protected evaluation assets, not canonical solution paths.”
  proposer: "[@S01]."
  background: "[@Zheng2022]; [@FormalConjectures2026]."
  solved: "A release with the four boundaries of §113.1 frozen by digest, at least one item in every counterexample stratum and every proof-task type, a working challenge process (§113.12.15), and results for at least two systems reported stratum by stratum."
  litcheck: "Benchmarks for formal and research mathematics exist [@Zheng2022; @FormalConjectures2026]; none found has the stratification, the abstention strata or the frozen constitution of Ch. 113."

