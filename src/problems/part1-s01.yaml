- num: 9
  title: "The seven obligations of descent execution"
  work: S01
  kind: formal
  level: research
  thesis: 5
  source: "Vol. III, §56.15, pp. 9130–9132, and §56.1, p. 9119"
  pages: ["9130", "9131", "9132", "9119"]
  status: "O"
  statement: |
    The Grothendieckian Descent Reasoning Architecture (GDRA) of [@S01], the layer that executes local-to-global
    campaigns, exists to prevent one error: “The central architectural error is to
    convert operational completion into global meaning.” Give a formal transition model of GDRA campaigns and prove the
    seven properties that §56.15 leaves open: “canonical serialization must preserve identity; every accepted
    transition must preserve the invariants; forbidden authority effects must be noninterfering; budget events must
    conserve declared dimensions; event replay must converge to the same eligible head under the stated delivery model;
    counterevidence closure must be omission-resistant; and adapters must preserve the disjoint failure constructors.”
  established: "The source states the seven properties and the delivery model (at-least-once delivery with idempotent effects), and records: “None has a supplied mechanized proof.”"
  proposer: "[@S01]."
  background: "Noninterference [@GoguenMeseguer1982]; linearizability [@HerlihyWing1990]."
  solved: "Machine-checked proofs of all seven properties for a model whose correspondence with Chapter 56 is documented clause by clause, or a machine-checked counterexample to one of them."
  litcheck: "Noninterference and replay-safety proofs exist for other systems; none for this model was found."

- num: 10
  title: "Non-self-authorization"
  work: S01
  kind: formal
  level: research
  thesis: 7
  source: "Vol. V, Proposition 1.3, p. 11913; Proposition 5.1, p. 11940; Proposition 10.1, p. 11979"
  pages: ["11913", "11940", "11979"]
  status: "D/O (definition; obligation)"
  statement: |
    The rule that machines propose and humans authorise publication is stated in [@S01, Vol. V] as three
    propositions, each conditional on assumptions about capabilities. Proposition 1.3 concludes that “a non-root module
    cannot, through a conforming Volume V interface, make its own output both authoritative and active”; Proposition
    10.1 that “adding a validated evidence edge to an artifact cannot by itself increase the artifact’s epistemic
    class”. Give a formal model of capabilities, signing and status transitions in which the hypotheses of
    Propositions 1.3, 5.1 and 10.1 are definitions, and prove the three conclusions.
  established: |
    The propositions are argued informally and marked D/O: “The proposition is conditional on correct capability
    isolation and validator independence; those conditions are test obligations, not assumptions to be hidden.” The
    negative cases (a worker writing to the status store, a signature detached from the artifact hash) are listed.
  proposer: "[@S01]."
  background: "[@DennisVanHorn1966]; [@SaltzerSchroeder1975]; [@GoguenMeseguer1982]."
  solved: "Machine-checked proofs of the three propositions in a published model, and a test suite showing that each listed negative case is rejected by an implementation conforming to the model."
  litcheck: "Verified capability machines and separation kernels exist; no formalisation of these three propositions was found."

- num: 11
  title: "Evolution without authority"
  work: S01
  kind: formal
  level: research
  thesis: 7
  source: "Vol. VI, §11.11, p. 13204; Vol. III, §21.16, item 12, pp. 8370–8371"
  pages: ["13204", "8370", "8371"]
  status: "O (obligation O-V6-11-04)"
  statement: |
    A self-improving component may propose changes to itself but must not acquire authority. In [@S01, Vol. VI] the
    obligation reads: “O-V6-11-04 — prove that no composition of EvolutionContract ports reaches signing, promotion,
    activation, root mutation, or rollback capabilities”. Prove it for a formal model of the evolution interface.
  established: |
    In the released architecture “Evolution remains inert: telemetry cannot evaluate candidates, adapt routing, update
    policy, canary, promote, deploy, or roll back.” The source does not claim more: “Until these obligations are
    discharged, policy morphisms and version graphs are precise governance objects, not a claim that safe whole-system
    evolution has been solved.”
  proposer: "[@S01]."
  background: "[@SaltzerSchroeder1975]; reward hacking as the failure this obligation guards against [@Skalse2022]."
  solved: "A machine-checked reachability theorem over all finite compositions of the ports of the published EvolutionContract model, with the model’s correspondence to Vol. VI, Ch. 11 documented; or a composition that reaches a forbidden capability."
  litcheck: "Recent work studies privilege escalation in AI agents empirically; no formal reachability proof for an evolution interface of this kind was found."

- num: 12
  title: "Deterministic identity across implementations"
  work: S01
  kind: machine
  level: entry
