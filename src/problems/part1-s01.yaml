  source: "Vol. V, Proposition 2.2, p. 11920, and Proposition 3.2, p. 11927"
  pages: ["11920", "11927"]
  status: "D/O"
  statement: |
    Build two independent implementations of the canonical serialization and replay profile of [@S01, Vol. V] and show
