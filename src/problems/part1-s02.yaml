- num: 32
  title: "Second-order disagreement without engineering"
  work: S02
  kind: math
  level: research
  thesis: 5
  source: "§1.1.13, p. 15; §1.2.5, p. 22; §9.1.7, p. 1766"
  pages: ["15", "22", "1766"]
  status: "open"
  statement: |
    “On a graph, and under standard top-k routing, H2 vanishes identically.” The degree-two (gerbe) theory of
    disagreement among experts is therefore vacuous unless the cover is built for it: “The minimal non-vacuous
    configuration is four experts arranged as ∂Δ3, and it must be engineered deliberately.” Determine whether covers
    produced by a data-driven routing or cover-construction procedure, on natural tasks, carry non-zero second
    cohomology with the coefficient data of [@S02].
  established: "The source proves the vanishing results and warns that “engineering a structure into existence in order to measure it is a move that deserves suspicion.” A gerbe diagnostic is “vacuous unless the cover has a deliberate, data-justified sparse nerve with genuine two-dimensional cycles and explicitly defined coefficient data.”"
  proposer: "[@S02]."
  background: "[@Giraud1971]; [@HansenGhrist2019]."
  solved: "A procedure, not tuned to produce two-cycles, whose covers on a published natural task carry a certified non-zero class in degree two; or a theorem that a stated class of procedures always yields vanishing second cohomology."
  litcheck: "No result on second cohomology of routing nerves was found."

