# The 57 Grothendieckian Problems — Part I, Series 02 (Problems 18–35). Conventions as in part1-s01.yaml.
- num: 18
  title: "Discovering the site"
  work: S02
  kind: machine
  level: programme
  thesis: 3
  source: "§1.2.5, p. 22"
  pages: ["22"]
  status: "open (listed among “The five things we are least sure of”)"
  statement: |
    In the architecture of [@S02] a context is a site, the information it supports is a sheaf, and a conclusion is a
    global section. The site itself is supplied by hand: “The site must be imposed. We do not know how to discover the
    evidence-atom locale from a corpus; we construct it.” Give a procedure that constructs the evidence-atom locale, its
    refinement order and its covering families from a corpus, with a stated sufficiency criterion, and show that the
    result does not merely reflect the design of the procedure.
  established: |
    The source states the objection it cannot answer: “a critic who says the invariants measure our design choices
    rather than the model’s structure has a real point that we cannot fully answer.” Learned restriction maps are
    studied elsewhere on a fixed graph [@Bodnar2022; @DiNino2024]; the base space is not learned there.
  proposer: "[@S02]."
  background: "[@HansenGhrist2019]; [@Bodnar2022]; [@DiNino2024]; [@MacLaneMoerdijk1992]."
  solved: "A procedure and a published evaluation in which (i) planted sites in synthetic corpora are recovered up to a declared isomorphism budget, (ii) the site constructed from a natural corpus is stable under resampling within that budget, and (iii) invariants computed on it survive the gaming controls of [@S02, §9.1] (terminal-site collapse, zero restrictions, filled nerve)."
  litcheck: "Sheaf neural networks with learned restriction maps on a given graph were found [@Bodnar2022; @DiNino2024]; no procedure that learns the site itself was found."

- num: 19
  title: "The capability wager"
  work: S02
  kind: machine
  level: research
  thesis: 4
  source: "Conjecture 3.6.17, p. 778; §1.2.5, p. 22"
  pages: ["778", "22"]
  status: "D (design-grade conjecture)"
  statement: |
    On an orthogonal cellular sheaf the non-abelian holonomy capacity $\beta$ of [@S02] is either $0$ or at least a
    constant $c(d)$ depending only on the stalk dimension. The wager is that $\beta$ governs capability. In the words of
    the source: “At matched parameters, data and compute, compare models with CERTIFIED_VIRTUALLY_ABELIAN and
    CERTIFIED_FREE reports on tasks requiring route-dependent evidence.” Decide the wager.
  established: |
    The dichotomy is proved; the wager is not. “That β governs capability is grade D and we have no proof. It is the
    most interesting claim in the document and the least supported.” The comparison is set up so that a negative
    result costs only the wager: “No theorem links the verdict to capability; failure of the registered comparison
    removes the capability claim while leaving the group theorem intact.”
  proposer: "[@S02]."
  background: "The Tits alternative [@Tits1972]; uniform growth gaps [@Breuillard2011]; [@HansenGhrist2019]."
  solved: "A preregistered comparison at matched parameters, data and compute, with certificates computed as in [@S02, Ch. 3.6], published with its outcome in either direction."
  litcheck: "No study linking holonomy growth of cellular sheaves to model capability was found."

- num: 20
  title: "Nerve baselines between GRPO and RLOO"
  work: S02
  kind: machine
  level: research
  thesis: 4
  source: "§1.2.4, pp. 21–22 (claim C11 of Appendix A7)"
  pages: ["21", "22"]
  status: "open empirical question"
  statement: |
    The source proves that the group-relative advantage of group relative policy optimisation (GRPO) [@Shao2024] equals $\Delta_0 R/\lVert\delta_0 R\rVert_2$
    for the $0$-Laplacian of the nerve of the sampling group, wherever $\sigma>0$. This places GRPO in “a family of graph
    baselines indexed by a nerve, of which the complete-graph member is GRPO and the i.i.d. leave-one-out member is
    RLOO.” (RLOO is the leave-one-out REINFORCE baseline [@Ahmadian2024].) Determine whether another member of the family reduces the variance of the policy-gradient estimate at
    matched cost.
  established: "The identity is proved and the family defined; “Whether any other member of that family reduces variance at matched cost is an open empirical question, tested by claim C11 of A7 and unanswered here.”"
  proposer: "[@S02]."
  background: "[@Shao2024]; [@Ahmadian2024]; recent baselines for reinforcement learning with verifiable rewards [@Zeng2025]."
  solved: "A theorem identifying, under stated assumptions on rewards, a nerve whose baseline has strictly smaller variance than both GRPO and RLOO at matched sampling cost, or proving that no member of the family does; or the registered experiment C11 with its outcome."
  litcheck: "Variance-reduction baselines for GRPO-type methods are an active topic [@Zeng2025]; no study of the nerve family was found."

- num: 21
  title: "Relative obstruction as a predictor of unsupported answers"
  work: S02
  kind: machine
  level: research
  thesis: 5
  source: "§10.1.7.3, pp. 1854–1855; instrument N5, §9.1.7, p. 1766"
  pages: ["1854", "1855", "1766"]
  status: "T for the mathematics; D for what remains; N5 withdrawn"
  statement: |
    For an evidence subdomain $A\subseteq X$, a coefficient sheaf $F$ and a partial section $s_A$, the connecting class
    $\partial(s_A)\in H^1(X,A;F)$ is a genuine obstruction to extending $s_A$. Supply the typed record that the source
    requires before this class may be used as an instrument, and test prospectively whether it predicts unsupported
    answers of a language model.
  established: |
    The mathematics is proved; the instrument is not: “N5 is therefore WITHDRAWN as a validation or falsification
    instrument.” Reinstatement requires six items, including “at least one worked non-zero example, together with a zero
    control, computed before labels are revealed”. The remaining task is stated as “What remains is the difficult empirical
    part: the evidence sheaf must reflect factual support, the relative class must be approximated at scale, and
    prospective prediction must beat entropy, retrieval sufficiency, self-consistency and correctness probes without
    site collapse.”
  proposer: "[@S02]."
  background: "[@HansenGhrist2019]; [@Farquhar2024]; [@Huntsman2024]."
  solved: "The six reinstatement items of §9.1.7 published for one benchmark, followed by a prospective comparison against entropy, sequence likelihood, verbal confidence, retrieval sufficiency, self-consistency and a trained correctness probe, reported in either direction."
  litcheck: "Hallucination detectors based on entropy and probes exist [@Farquhar2024]; sheaf-based consistency rating has been proposed [@Huntsman2024]; no instrument based on a relative connecting class was found."

- num: 22
  title: "Topos-MoE against modern sparse mixture-of-experts"
  work: S02
  kind: machine
  level: research
  thesis: 4
  source: "§10.1.7.2, p. 1854; instrument N7, §9.1.9, pp. 1768–1769"
  pages: ["1854", "1768", "1769"]
  status: "D"
  statement: |
    In Topos-MoE, the mixture-of-experts layer of [@S02], each expert is an open sub-topos and routing constructs a
    sufficient cover. Run the registered
    comparison N7 of [@S02, §9.1.9] against a modern fine-grained sparse mixture-of-experts at matched total and active
    parameters, executed FLOPs, wall time and communication. “Coverage routing must beat top-k on quality and on total
    cost; lowering its own deficiency score proves nothing about either.”
  established: |
    The descent typing is proved; the benefit is not. In the released configuration the coverage router cannot yet be
    trained, and it “may not report the coverage router as a trained component until that backward exists and is
    finite-difference checked.” The thresholds are fixed in advance: “Confirmation requires a 10 per cent relative
    reduction in multi-expert composition error or a 3-point absolute improvement, while remaining within 1 per cent of
    the top-k baseline on single-expert tasks and within 10 per cent of its throughput.”
  proposer: "[@S02]."
  background: "[@Shazeer2017]; [@Fedus2022]; categorical approaches to architectures [@Gavranovic2024; @Mahadevan2025]."
  solved: "A trainable coverage router with a finite-difference-checked backward pass, and the N7 comparison executed under the registered protocol, reporting confirmation or one of the registered null outcomes."
  litcheck: "Many routing variants for mixture-of-experts were found; none uses sheaf-theoretic coverage routing with these controls."

- num: 23
  title: "A defence against a globally coherent falsehood"
  work: S02
  kind: machine
  level: programme
  thesis: 5
  source: "§1.2.5, p. 22"
  pages: ["22"]
  status: "open (“we have no structural defence to propose”)"
  statement: |
    “Descent verification provably catches local inconsistency. Against a globally coherent falsehood it offers
    nothing, and we have no structural defence to propose.” Give a verification method that detects a stated class of
    globally coherent falsehoods, or prove that no verifier with access only to stated information can do so.
  established: "The source proves the local guarantee and records the global gap as one of “The five things we are least sure of”; Part VI of [@S02] discusses reward hacking at length without proposing a defence."
  proposer: "[@S02]."
  background: "[@Skalse2022]; selective prediction [@ElYanivWiener2010]; [@Farquhar2024]."
  solved: "Either a method with a theorem stating which globally coherent falsehoods it detects and at what cost, evaluated on a published adversarial benchmark, or an impossibility theorem for a stated class of verifiers."
  litcheck: "Consistency- and verification-based hallucination detection was found; no structural defence or impossibility theorem for globally coherent falsehoods was found."

- num: 24
  title: "Compiled-to-streaming descent stability"
  work: S02
  kind: math
  level: research
  thesis: 4
  source: "Conjecture 2.2.15, p. 104"
  pages: ["104"]
  status: "D/OPEN"
  statement: |
    Consider a session tower of finite certified sites and solid-valued states $(\mathcal C_n,P_n,F_n)_{n\ge 0}$ with the
    site maps of [@S02, §2.2]. Conjecture 2.2.15: “If the cd-certificates are uniformly compatible under these site
    morphisms, the density bound is uniform, the coefficient towers satisfy the required derived-limit vanishing
    condition, and the finite probe systems form a conservative filtered family, then the limit state satisfies
    Nisnevich descent with solid condensed coefficients.” Prove or refute it.
  established: |
    “The hypotheses are not discharged.” The source explains which hypotheses fail in practice — “Uniform density
    generally fails when new maximal atoms are added; derived-limit vanishing is not certified by the runtime; and no
    conservative finite probe family has been proved for arbitrary state classes” — and that “The conjecture therefore
    cannot be used to upgrade stagewise FINITE-ONLY certificates to a session-wide theorem.”
  proposer: "[@S02]."
  background: "Nisnevich descent [@MorelVoevodsky1999]; condensed and solid mathematics [@Scholze2019condensed]; [@Lurie2009]."
  solved: "A proof of the conjecture as stated, or a counterexample tower satisfying the four hypotheses whose limit state fails Nisnevich descent."
  litcheck: "Work on descent for condensed and syntomic coefficients was found; no result on limits of towers of finite certified sites was found."

- num: 25
  title: "The Beck–Chevalley square 12.6.3"
  work: S02
  kind: math
  level: research
  thesis: 4
  source: "§2.4.4, pp. 157–158 (Proposition 2.4.24, Theorem 2.4.25)"
  pages: ["157", "158"]
  status: "globally open"
  statement: |
    For a context family $\mathrm{Rep}\colon\mathcal C_{\mathrm{ref}}\to\mathrm{Cat}_\infty$, transport along
    refinements is coherent by straightening, but “Straightening supplies no Beck–Chevalley comparison for that square”
    formed by a refinement arrow and a cover restriction, and Proposition 2.4.24 shows that “The gap is real even in
    discrete categories.” Characterise the families and covers for which the comparison
    $\rho_V\circ r_!\Rightarrow (r_i)_!\circ\rho_U$ exists, is invertible, and satisfies the identity, composition and
    overlap coherence laws, so that the conditional Theorem 2.4.25 applies.
  established: |
    Theorem 2.4.25 proves coverwise transport under exactly these hypotheses, and Chapter 13.5 audits finite fixtures;
    the source calls this “a scope restriction and conditional local closure, not a general solution.” “The monograph
    does not close the gap globally.”
  proposer: "[@S02]."
  background: "[@Lurie2009]; [@MacLaneMoerdijk1992]; [@SGA4]."
  solved: "A theorem giving necessary and sufficient conditions, in a stated generality, for the comparison of Theorem 2.4.25 to exist with its coherences, or a proof that no condition weaker than the hypothesis itself suffices in that generality."
  litcheck: "Recent work on Beck–Chevalley fibrations concerns ambidexterity and norm squares; no result on refinement–cover squares of this kind was found."

- num: 26
  title: "Sharp accumulation bounds for equivariance defects"
  work: S02
  kind: math
  level: research
  thesis: 6
  source: "Question 11.11.18, p. 2259"
  pages: ["2259"]
  status: "X (open question)"
  statement: |
    The accumulation bound of [@S02, Theorem 11.9.28] for the equivariance defects of successive layers is tight in the
    worst case, but its use as a certificate needs a lower bound on output norms that is not available. Question 11.11.18
    asks: “Is there a class of architectures with certified lower norm control on which a usable ratio of bound to
    witness is O(1)? Failing that, is there a sharper bound that tracks the direction of the equivariance defect rather
    than only its magnitude, for instance by carrying a covariance rather than a scalar?”
  established: |
    “Theorem 11.9.28 is tight in the worst case, with both of its constants attained.” Without the lower-norm premise
    the gate leaves the claim open: “A witness may still falsify a claim but cannot replace the missing certificate.”
    The source suggests, without attempting it, that defects may add in quadrature under a randomness assumption.
  proposer: "[@S02]."
  background: "Error accumulation in composed computations [@Higham2002]; equivariance in deep learning [@Bronstein2021]."
  solved: "Either a class of architectures with certified lower norm control on which the ratio of bound to witness is proved O(1), or a direction-sensitive bound strictly sharper than Theorem 11.9.28 on a stated class, with proof."
  litcheck: "No result of this form for equivariance defects was found."

