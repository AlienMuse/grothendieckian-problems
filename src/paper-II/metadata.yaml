abstract: |
  We state fifty-seven open problems drawn from the seven works of the Grothendieckian Programme (34 volumes, 26,021
  pages, released openly in October 2026 as first drafts that have not been peer-reviewed). Thirty-five come from the
  two works on the architecture of a reasoning system and twenty-two from the five works that each take a named
  conjecture or programme as research subject; no problem is one of those conjectures. Each problem is stated in the words of
  its source, located by work, chapter and page, given the status the source assigns it, and paired with a criterion
  that decides when it is solved, a note on existing work and the date of a literature check. The problems are of
  three kinds: twenty-five mathematical problems, nineteen machine problems with success criteria fixed in advance,
  and thirteen formalization problems for Lean 4 and Mathlib. Every quotation from the sources has been checked against the published PDFs, and each problem has been checked against the literature as of 28 October 2026; a machine-readable version accompanies the paper.
