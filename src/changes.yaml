# Changes made to the approved selection by the literature check of 28 October 2026 (paper II, Appendix B).
- {num: 26, was: "Robust exact group scan [@S02, Open Problem 2.14.C]", why: "Replaced by Question 11.11.18 of [@S02]. Without the numerical setting of [@S02, Ch. 2.14], the problem reduces to multiplying permutation matrices, which floating-point arithmetic performs exactly; stated on its own it would be misleading."}
- {num: 34, was: "A second kernel [@S02, Open Problem 13.15.D]", why: "Narrowed and moved to entry level. Independent type checkers for Lean 4 exist [@Carneiro2024; @Nanoda]; the remaining task is to replay the declarations of [@S02] under two of them."}
- {num: 38, was: "Pin(2)-twisted topological Hochschild homology [@S03, Problem 28.13]", why: "Narrowed. The first question of the source, whether a Pin(2)-equivariant lift of THH exists, has been answered by quaternionic THH [@AMP2026]; the second question is kept. The source’s statement that no construction is known is listed in the errata."}
- {num: 39, was: "A certified finite-height computation [@S03, Problem J.38]", why: "Replaced by falsification predicate F2 [@S03, Criterion 58.9]. Certified computation of the zeros of the zeta function to great height is established [@PlattTrudgian2021], and the source’s problem asks for a computation of a related kind with no decision criterion beyond it."}
- {num: 40, was: "The Construction Problem [@S04, Problem 54.1.1]", why: "Replaced by Problem 22.7.1 of [@S04]. The source records that its axiom F12 carries essentially the whole arithmetic content of the conjecture of Birch and Swinnerton-Dyer [@S04, Remark 56.2.1], so the original would fall under the exclusion of problems whose solution proves a named conjecture."}
- {num: 45, was: "The certification boundary [@S05, Problem 71.9.3]", why: "Replaced by Problem 71.3.4 of [@S05]. In the form stated, the impossibility of certifying a relation from finite-precision data follows from the undecidability of equality of computable real numbers, a standard result of computable analysis."}
- {num: 47, was: "The Rigidification Conjecture in rank two [@S05, Problem 71.6.3]", why: "Replaced by Problem 71.3.3 of [@S05]. The relation of the rank-two case to known results, including the Lefschetz (1,1) theorem, needs an expert reading before it can be posed as open."}
