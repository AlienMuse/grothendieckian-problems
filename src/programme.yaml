# The Grothendieckian Programme (Series 00) — the single source of data (runbook §1 rule 13).
# The book's numbers and front pages, Figure 1, the covers, the repository README, programme.json, the website and
# the profile README are generated from this file or checked against it.
# Hand-written: programme, cells, core. Machine-written (between markers): facts (master/tools/facts_extract.py,
# from the seven sealed releases) and stats (master/tools/corpus_stats.py). Decisions: RUNBOOK-v1.0.0.md §3.2.

programme:
  name: "The Grothendieckian Programme"
  name_zh: "格罗滕迪克纲领"
  subtitle: "Recursive Mathematical Discovery in the Age of Machine Reasoning"          # D0
  overview_line: "An overview of Series 01–07"                                          # D0
  series: "00"
  role: "the Programme's overview"                                                      # not one of the seven works
  series_line: "WiseMotif Monograph of Mathematical Intelligence, Series 00 · Mathematics and Artificial Intelligence"   # D11
  edition: "Research Architecture Edition 1"
  version: "1.0.0"
  language: "en"
  author:
    name: "Vincent Liu"
    orcid: "0009-0000-8718-222X"
    affiliation: "WiseMotif.ai"
  github:
    owner: "AlienMuse"
    repo: "grothendieckian-programme"                                                   # D14
    pages: "https://alienmuse.github.io"                                                # D15
  licence: "CC-BY-NC-ND-4.0"                                                            # §1 rule 8: no companion code
  msc:                                                                                  # D12; the seven works' primary
    primary: "00A35"                                                                    # classes follow from facts
    secondary: ["68T01", "68V15", "18F10", "14A15"]
  keywords:                                                                             # draft until gate B
    - "Grothendieckian Programme"
    - "recursive mathematical discovery"
    - "machine reasoning"
    - "mathematical worlds"
    - "verification-first architecture"
    - "topos theory"
    - "descent"
    - "Riemann Hypothesis"
    - "Birch and Swinnerton-Dyer conjecture"
    - "Hodge conjecture"
    - "abc conjecture"
    - "Langlands programme"
  # Publication and Edition Record (D11; §1 rules 3 and 6). Draft until gate B; final wording at gate C.
  claim_boundary: >
    This book is an overview of seven works and adds no mathematical result to them. None of the seven works
    claims a proof of the Riemann Hypothesis, the Generalized Riemann Hypothesis, the Birch and Swinnerton-Dyer
    conjecture, the Hodge conjecture, the abc conjecture or the Langlands correspondence. Each work states what it
    establishes, what it reduces to stated hypotheses and what it leaves open; this overview reports those
    statements with the status each work gives them, and Chapter 10 quotes the claim boundary of each work in its
    own words.
  name_statement: >
    The adjective Grothendieckian names a mathematical method used in the seven works. It carries no attribution
    of design or endorsement to Alexander Grothendieck or to any other mathematician whose work the seven works
    cite; the dedication expresses respect only.

