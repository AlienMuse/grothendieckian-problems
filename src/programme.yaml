# is one the chapter that shows the figure already states, with its source; the numbers of Figure "numbers" come from
# facts and stats below. master/tools/figures_web.py writes each figure's data from here.
figures:
  numbers:
    title: "THE SEVEN WORKS IN NUMBERS"
    right: "TWO INDEPENDENT COUNTS · SEALED EDITIONS"
    panels:
      - {key: pages, label: "PAGES"}
      - {key: formulas, label: "FORMULAS"}
      - {key: statements, label: "STATEMENTS"}
    totals:
      - {key: volumes, label: ["VOLUMES"]}
      - {key: pages, label: ["PAGES"]}
      - {key: chapters, label: ["CHAPTERS"]}
      - {key: formulas, label: ["FORMULAS"]}
      - {key: statements, label: ["NUMBERED", "STATEMENTS"]}
      - {key: algorithms, label: ["ALGORITHMS"]}
      - {key: figures_and_plates, label: ["FIGURES", "AND PLATES"]}
    notes:
      - "+ a lower bound: where the two counts differ, the smaller is given."
      - "Statements: numbered theorems, propositions, lemmas, corollaries, definitions and conjectures."
  cycle:
    title: "RECURSIVE MATHEMATICAL DISCOVERY"
    right: "ONE RECURSION, RECORDED IN FULL"
    source: "SERIES 03–07 · SERIES NOTE"                       # S07, Series Note (Chapter 3, §3.1)
    steps:
      - {code: "PROPOSE", lines: ["a structure, raised", "around the problem"]}
      - {code: "TEST", lines: ["against the cases in", "which the answer", "is already known"]}
      - {code: "ABSTRACT", lines: ["what survives,", "into a new setting"]}
      - {code: "ASK AGAIN", lines: ["the question,", "at the new level"]}
    tests:
      title: "TESTED AGAINST WHAT IS KNOWN"
      groups:
        - {head: "LANGLANDS · SERIES 07", items: ["the function-field case", "the de Rham limit", "the local fields", "the abelian case", "the curve of conductor eleven"]}   # S07, Preface
        - {head: "HODGE · SERIES 05", items: ["divisors", "dimension at most three", "cubic fourfolds", "abelian surfaces"]}   # S05, Series Note
        - {head: "RIEMANN · SERIES 03", text: "every proposed mechanism is run on four published counter-models before it is admitted, each chosen to expose one source of overreach"}   # S03, Preface
    ledger:
      title: "WHAT DOES NOT SURVIVE IS KEPT"
      items: ["a proof obligation", "an obstruction", "a conjecture", "a gap", "a falsification test"]   # S06, Preface; S07, Preface
      rule: "each with a statement, a status and an owner, carried forward as part of the result"        # S06, Preface
      example: "Series 03: the refutation of one polarisation identified the index-one formulation"     # S03, Preface
    outputs:
      title: "THREE OUTPUTS A READER CAN CHECK · SERIES 04"     # S04, Preface
      items:
        - ["constructions specified", "exactly enough to be attempted"]
        - ["conditional theorems", "proved in full"]
        - ["obstructions stated precisely enough", "to be attacked, priced or refuted"]
  authority:
    title: "AUTHORITY IN THE CORE"
    right: "SERIES 01 · VOLUME III"
    status:                                                   # S01, Vol. III, Preface (Chapter 5, §5.3)
      title: "STATUS IS PART OF THE TYPE"
      note: "a tagged type, not a confidence ladder"
      codes:
        - ["E", "established"]
        - ["S", "source-grounded synthesis"]
        - ["D", "project-native definition"]
        - ["R", "falsifiable research construction"]
        - ["C", "conjecture"]
        - ["O", "obligation"]
        - ["Q", "disputed"]
    chain:                                                    # S01, Vol. III, Ch. 3
      title: "A CHAIN OF NON-IMPLICATIONS · CH. 3"
      items: [["operational", "completion"], ["mathematical", "validity"], ["epistemic", "promotion"], ["publication"]]
      note: "each implication needs its own input, judgment and authority"
    ranking:                                                  # S01, Vol. III, Preface
      left: "MAY RANK CANDIDATES OR ALLOCATE REVIEW"
      signals: ["citation frequency", "vector similarity", "model confidence", "consensus", "novelty", "benchmark performance", "elegance", "reward"]
      right: "SEMANTIC AUTHORITY"
      sources: ["exact evidence", "a named decision"]
      note: "arises only from"
    labour:                                                   # S01, Vol. III, Architectural Prospectus
      title: "THE DIVISION OF LABOUR"
      items:
        - {code: "RETRIEVAL", text: "may supply candidate evidence but cannot change truth status"}
        - {code: "FORMAL KERNEL", text: "a named, pinned formal kernel may check a proof term against a formal target, while the fidelity of that target and the authority to publish remain separate obligations"}
        - {code: "COMPUTATION", text: "computational systems may supply scoped evidence when their inputs, bounds, environments and replay conditions are recorded"}
        - {code: "HUMANS", text: "humans authorise publication"}
  kernel:
    title: "THE KERNEL IN SEVEN OPERATIONS"
    right: "SERIES 02 · TOPOS-NATIVE INTELLIGENCE"
    premise: ["A CONTEXT IS A SITE", "WHAT IT SUPPORTS IS A SHEAF", "A CONCLUSION IS A GLOBAL SECTION"]   # S02, Series Note; Preface
    ops:                                                      # S02, Preface (Chapter 6, §6.3)
      - {code: "COVER", lines: ["constructs a site from", "a pool of evidence; its", "covers say when pieces", "are enough"]}
      - {code: "ASSIGN", lines: ["a sheaf over the site;", "stalks may differ", "in dimension"]}
      - {code: "TRANSPORT", lines: ["attention rebuilt as", "descent: values carried", "along restriction maps", "into an overlap"]}
      - {code: "GLUE", lines: ["a named solver; it", "reports the residual", "where gluing is", "impossible"]}
      - {code: "OBSTRUCT", lines: ["measures what fails", "to glue and returns it;", "without independent", "overlap data, abstains"]}
      - {code: "DECIDE", lines: ["Kripke–Joyal forcing:", "each verdict with the", "part of the site on", "which it is forced"]}
      - {code: "CHANGE BASE", lines: ["transfer as a morphism", "of sites: what it", "preserves, what it", "forgets"]}
    outputs:                                                  # S02, Preface (Chapter 6, §6.2)
      - {code: "GLOBAL SECTION", lines: ["where the local", "information glues"], at: "GLUE"}
      - {code: "COHOMOLOGY CLASS", lines: ["an obstruction with a", "location and a size"], at: "OBSTRUCT"}
    note: "nine layers over a single base · in Topos-MoE each expert is an open sub-topos, and routing constructs a sufficient cover"   # S02, Abstract

# The decomposition panel of the core — Figure 1 (detailed version) only, D5. Names and chapters as printed in
# Series 01, Volume III; pages are added in step 2 (master/SOURCES.md).
core:
  gmus:
    name: "GMUS"
    expansion: "Grothendieck Mathematical Universe System"
    parts:
      # MUE = the Motivic Unification Engine, the GMUS component (S01 Vol. III Ch. 15, pp. 8239, 8248; Vol. V Ch. 37,
      # p. 12340: "the lower structured substrate of the GMUS engine family"). Distinct from "Mathematical Universe
      # Engines", the concept named in the subtitle of Volume III (pp. xix, 7945, 7947) — the author, 2026-10-25
      # (AUTHOR-QUESTIONS Q6). The Volume III preface sentences that write "the Mathematical Universe Engine" for the
      # GMUS component (pp. 7955, 7960) are not quoted in Series 00.
      - {name: "MUE", full: "Motivic Unification Engine", note: "a structured, non-vectorial latent space", chapters: "15–21", fig: "a structured, non-vectorial latent space"}
      - {name: "GCL", full: "Geometric and Cohomological Layer", note: "the semantic floor below MUE (S01, pp. 8219, 12340)", chapters: "15", fig: "the semantic floor below MUE"}
      - {name: "MUF-H", full: "", note: "Motivic Universal Factorization Algorithm—Hybrid: a bounded research backend for MUE (S01, pp. 8290, 12362)", chapters: "18", fig: "Motivic Universal Factorization Algorithm—Hybrid"}
      - {name: "TRE", full: "Topos Reasoning Engine", note: "TNCA (creation, Ch. 24–27) + TNRA (reasoning, Ch. 28–32)", chapters: "22–23", fig: "twin engines: TNCA creates, TNRA reasons"}
      - {name: "GRA", full: "Grothendieckian Research Architecture", note: "a source-audited parallel research lane", chapters: "34–40", fig: "a source-audited research lane"}
  gmls:
    name: "GMLS"
    expansion: "Grothendieckian Mathematical Language System"
    parts:
      - {name: "Language forge", note: "Collect → Mine → Name → Notate → Ground → Reconstruct → Axiomatize → Grow → Re-encode → Validate", chapters: "41–48", fig: "Collect, Mine, Name, Notate … Re-encode, Validate"}
      - {name: "GCA", full: "Grothendieckian Cognitive Architecture", note: "contexts, covers and obstructions", chapters: "49–55", fig: "contexts, covers, overlap obstructions"}
      - {name: "GDRA / DDA", note: "Grothendieckian Descent Reasoning Architecture / Diagrammatic Descent Agent", chapters: "56–63", fig: "the local-to-global descent workflow"}
      - {name: "AURORA", note: "the experimental boundary of Volume III (not the wave image of the covers)", chapters: "64–70", fig: "the experimental boundary"}
  coupling: {name: "The Coupled Rising-Sea Cycle", chapters: "71–78", cycle_chapter: "75"}
  planes:
    chapter: "3"
    names: ["mathematical meaning", "proposal and discovery", "certified computation", "evidence and governance", "operations"]
    rule: "operational completion ⇏ mathematical validity ⇏ epistemic promotion ⇏ publication"

